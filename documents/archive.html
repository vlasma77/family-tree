<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исторический Архив Документов</title>
  <style>
    :root {
      --bg-main: #d6d3d1;
      --bg-card: #e8dcbf;
      --bg-item: #f5f5f4;
      --border-color: #856f49;
      --text-main: #1c1917;
      --link-color: #7c2d12;
    }

    body {
      font-family: 'Georgia', serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .archive-container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      font-family: sans-serif;
      font-size: 24px;
      color: #292524;
      border-bottom: 1px solid #a8a29e;
      padding-bottom: 12px;
      margin-bottom: 25px;
    }

    /* Профессиональная адаптивная сетка (Mobile First) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
    }

    .doc-card {
      background: var(--bg-item);
      border: 1px solid #a8a29e;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .doc-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .img-wrapper {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7e5e4;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid #d6d3d1;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      .img-wrapper { height: 210px; }
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Красивое заполнение карточки */
    }

    /* НОВОЕ: видео занимает то же место, что и фото, но без cursor:pointer конфликта с контролами */
    .img-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* НОВОЕ: аудио — отдельный, невысокий блок вместо квадратной картинки */
    .audio-wrapper {
      width: 100%;
      padding: 30px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7e5e4;
      border-radius: 4px;
      border: 1px solid #d6d3d1;
    }
    .audio-wrapper audio {
      width: 100%;
    }

    .doc-title {
      font-size: 12px;
      margin-top: 8px;
      font-weight: 600;
      color: #444;
      word-break: break-word;
      line-height: 1.3;
    }

    @media (min-width: 600px) {
      .doc-title { font-size: 13px; margin-top: 10px; }
    }

    .no-docs {
      grid-column: 1 / -1;
      text-align: center;
      font-style: italic;
      color: #78716c;
      padding: 50px 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      margin-bottom: 20px;
      color: var(--link-color);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .back-link:hover { text-decoration: underline; }

    /* Высокопроизводительное модальное окно галереи */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 10000;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(12, 10, 9, 0.95);
      align-items: center;
      justify-content: center;
    }
    
    .lightbox.active { display: flex; }
    
    .lightbox img {
      max-width: 95%;
      max-height: 85%;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .lightbox-close {
      position: absolute;
      top: 15px; right: 20px;
      color: #e7e5e4; font-size: 36px;
      cursor: pointer; user-select: none;
      padding: 10px;
      z-index: 10002; /* Поднимаем крестик над самой картинкой */
      pointer-events: auto; /* Принудительно разрешаем клики мыши */
    }

    /* ВОТ СЮДА МЫ ДОВАВИЛИ СТИЛЬ ДЛЯ КОНТЕЙНЕРА PDF */
    #lightbox-content {
      width: 90%;
      max-width: 1000px;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* НОВОЕ: карточка "книги" (много пронумерованных сканов подряд) */
    .book-icon {
      background: linear-gradient(135deg, #856f49, #5c4a30);
      color: #f5f5f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .book-icon .book-emoji { font-size: 40px; margin-bottom: 6px; }
    .book-icon .book-count { font-size: 12px; font-weight: bold; }

    /* НОВОЕ: постраничная читалка книги */
    .reader {
      display: none;
      position: fixed;
      z-index: 10001;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(12, 10, 9, 0.97);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .reader.active { display: flex; }
    .reader-page-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      touch-action: pinch-zoom pan-x pan-y;
    }
    .reader-page-wrapper img {
      max-width: 92%;
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      border-radius: 4px;
      user-select: none;
      transition: max-width 0.15s, max-height 0.15s;
      cursor: zoom-in;
    }
    .reader-page-wrapper img.zoomed {
      max-width: none;
      max-height: none;
      width: 220%;
      cursor: zoom-out;
    }
    .reader-zoom-controls {
      position: absolute;
      bottom: 90px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10003;
    }
    .reader-zoom-btn {
      background: rgba(133, 111, 73, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    .reader-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 10px;
      color: #f5f5f4;
      font-family: sans-serif;
    }
    .reader-btn {
      background: #856f49;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }
    .reader-btn:disabled { opacity: 0.35; cursor: default; }
    .reader-page-counter { font-size: 14px; min-width: 90px; text-align: center; }
    .reader-close {
      position: absolute;
      top: 15px; right: 20px;
      color: #e7e5e4; font-size: 36px;
      cursor: pointer; user-select: none;
      padding: 10px;
      z-index: 10002;
    }
  </style>
  <script src="../database.js"></script>
  <!-- НОВОЕ: отдельный файл со списком документов, который собирает generate_db.js -->
  <script src="../documents-index.js"></script>
</head>
<body>

<div class="archive-container">
  <a href="../index.html" class="back-link">← Вернуться к Семейному Дереву</a>
  <h1 id="archive-header">Архивные документы</h1>
  <div class="grid" id="archive-grid"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <div id="lightbox-content" onclick="event.stopPropagation()"></div>
</div>

<!-- НОВОЕ: постраничная читалка для "книг" (много сканов подряд) -->
<div class="reader" id="reader">
  <span class="reader-close" onclick="closeReader()">&times;</span>
  <div class="reader-page-wrapper" id="reader-page-wrapper">
    <img id="reader-img" src="" alt="Страница">
  </div>
  <div class="reader-zoom-controls">
    <button class="reader-zoom-btn" onclick="readerZoomIn()" title="Приблизить">+</button>
    <button class="reader-zoom-btn" onclick="readerZoomOut()" title="Отдалить">−</button>
  </div>
  <div class="reader-controls">
    <button class="reader-btn" id="reader-prev" onclick="readerPrev()">←</button>
    <span class="reader-page-counter" id="reader-counter">1 / 1</span>
    <button class="reader-btn" id="reader-next" onclick="readerNext()">→</button>
  </div>
</div>

<script>
  function getQueryParam(param) {
    return new URLSearchParams(window.location.search).get(param);
  }

  function initArchive() {
    const id = getQueryParam("id");
    const currentLang = getQueryParam("lang") || "ru"; // Перенесли наверх, чтобы использовать везде
    const grid = document.getElementById("archive-grid");
    const header = document.getElementById("archive-header");
    const backLink = document.querySelector(".back-link"); // Находим ссылку возврата
    const db = window.db || window.database;
    // НОВОЕ: документы теперь читаем из отдельного файла, а не из person.documents
    const docsIndex = window.documentsIndex || {};

    // Сразу локализуем ссылку возврата, сохраняя параметр языка в URL
    if (backLink) {
      if (currentLang === "en") {
        backLink.innerText = "← Return to Family Tree";
        backLink.href = `../index.html?lang=en`;
      } else {
        backLink.innerText = "← Вернуться к Семейному Дереву";
        backLink.href = `../index.html?lang=ru`;
      }
    }

    if (!id || !db || !db[id]) {
      grid.innerHTML = currentLang === "en" 
        ? `<div class="no-docs">The specified relative was not found in the database.</div>`
        : `<div class="no-docs">Указанный родственник не найден в базе данных.</div>`;
      return;
    }

    const person = db[id];
    
    // Переводим заголовок архива в зависимости от языка
    if (person.name) {
      // Пытаемся взять имя на нужном языке, если английского нет — берем русский
      const personName = (currentLang === "en" && person.name.en) ? person.name.en : (person.name.ru || id);
      
      if (currentLang === "en") {
        header.innerText = `Archival Documents — ${personName}`;
      } else {
        header.innerText = `Архивные документы — ${personName}`;
      }
    } else {
      // Резервный случай, если структуры name вообще нет
      header.innerText = currentLang === "en" ? "Archival Documents" : "Архивные документы";
    }

    // НОВОЕ: берём документы персоны из documents-index.js вместо person.documents
    let docs = docsIndex[id] || [];

    // Резервный вариант: если документов нет, но есть главное фото, показываем его
    if (docs.length === 0 && person.mainPhoto && person.mainPhoto.trim() !== "") {
      const photoPath = person.mainPhoto.startsWith("../") ? person.mainPhoto : "../" + person.mainPhoto;
      docs = [{ url: photoPath, type: "image", title: { ru: "Портрет из карточки", en: "Main Photo" } }];
    }

    if (docs.length === 0) {
      grid.innerHTML = currentLang === "en"
        ? `<div class="no-docs">There are no files in this person's archive yet.</div>`
        : `<div class="no-docs">В архиве этой персоны файлы пока отсутствуют.</div>`;
      return;
    }

    grid.innerHTML = "";

    docs.forEach(item => {
      const card = document.createElement("div");
      card.className = "doc-card";

      // НОВОЕ: у "книги" (сгруппированные сканы) нет поля url — вместо
      // этого список страниц лежит в item.pages. Обрабатываем её отдельно,
      // до проверки на обычный fileName, иначе она будет пропущена.
      if (item.type === "book" && Array.isArray(item.pages)) {
        const pageCount = item.pages.length;
        let bookTitle = "Документ";
        if (currentLang === "en") {
          bookTitle = (item.title && item.title.en) ? item.title.en : "Scanned Document";
        } else {
          bookTitle = (item.title && item.title.ru) ? item.title.ru : "Отсканированный документ";
        }
        const folder = person.archive || id;
        const folderPath = `../documents/${folder}/`;
        card.innerHTML = `
          <div class="img-wrapper book-icon" onclick='openReader(${JSON.stringify(item.pages)}, "${folderPath}")'>
            <div class="book-emoji">📖</div>
            <div class="book-count">${currentLang === 'en' ? pageCount + ' pages' : pageCount + ' стр.'}</div>
          </div>
          <div class="doc-title">${bookTitle}</div>
        `;
        grid.appendChild(card);
        return;
      }

      const fileName = item.url || item.file;
      if (!fileName) return;

      // Умный расчет путей с выходом на уровень вверх из подпапки
      let fullPath = "";
      if (fileName.startsWith("../") || fileName.includes("/")) {
        fullPath = fileName.startsWith("../") ? fileName : "../" + fileName;
      } else {
        const folder = person.archive || id;
        fullPath = `../documents/${folder}/${fileName}`;
      }
      
      // Выбираем правильное название для карточки:
      let displayTitle = "Документ"; 
      
      if (currentLang === "en") {
        displayTitle = (item.title && item.title.en) ? item.title.en : "Archive Document";
      } else {
        displayTitle = (item.title && item.title.ru) ? item.title.ru : (typeof item.title === 'string' ? item.title : "Документ");
      }

      // НОВОЕ: определяем тип файла — сначала смотрим на поле type (его пишет generate_db.js),
      // а если его нет (старые записи) — определяем по расширению, как раньше.
      const ext = fileName.toLowerCase().split('.').pop();
      let fileType = item.type;
      if (!fileType) {
        if (ext === 'pdf' || ext === 'doc' || ext === 'docx' || ext === 'txt') fileType = 'document';
        else if (['mp4','mov','webm','m4v'].includes(ext)) fileType = 'video';
        else if (['mp3','wav','m4a','ogg'].includes(ext)) fileType = 'audio';
        else fileType = 'image';
      }

      if (fileType === 'document') {
        // Текстовые документы (PDF/DOC/DOCX/TXT) — открываем в новой вкладке по клику
        const badgeLabel = ext === 'pdf' ? 'PDF' : ext.toUpperCase();
        card.innerHTML = `
          <div class="img-wrapper" onclick="window.open('${fullPath}', '_blank')" style="background: #b91c1c; color: #fff; font-family: sans-serif; font-weight: bold; font-size: 24px; letter-spacing: 2px;">
            ${badgeLabel}
          </div>
          <div class="doc-title">${displayTitle}</div>
        `;
      } else if (fileType === 'video') {
        // НОВОЕ: видео проигрывается прямо в карточке, с обычными элементами управления браузера
        card.innerHTML = `
          <div class="img-wrapper" style="cursor: default;">
            <video controls preload="metadata" playsinline>
              <source src="${fullPath}">
            </video>
          </div>
          <div class="doc-title">${displayTitle}</div>
        `;
      } else if (fileType === 'audio') {
        // НОВОЕ: аудио показывается как аудиоплеер, без картинки
        card.innerHTML = `
          <div class="audio-wrapper">
            <audio controls preload="metadata">
              <source src="${fullPath}">
            </audio>
          </div>
          <div class="doc-title">${displayTitle}</div>
        `;
      } else {
        // Обычное изображение — по клику открывается в полноэкранной галерее (как раньше)
        card.innerHTML = `
          <div class="img-wrapper" onclick="openLightbox('${fullPath}')">
            <img src="${fullPath}" alt="${displayTitle}" loading="lazy" onerror="this.src='../photos/default.jpg';">
          </div>
          <div class="doc-title">${displayTitle}</div>
        `;
      }
      grid.appendChild(card);
    });
  }

  // НОВОЕ: вычисляем путь к папке документов персоны (для страниц книги,
  // у которых в data хранится только голое имя файла, без пути)
  function folderForPaths(person, id) {
    const folder = person.archive || id;
    return `../documents/${folder}/`;
  }

  // === НОВОЕ: постраничная читалка книги ===
  let readerPages = [];
  let readerIndex = 0;

  function openReader(pages, folderPath) {
    if (!pages || pages.length === 0) return;
    readerPages = pages.map(p => folderPath + p);
    readerIndex = 0;
    renderReaderPage();
    document.getElementById("reader").classList.add("active");
  }

  function closeReader() {
    document.getElementById("reader").classList.remove("active");
  }

  function renderReaderPage() {
    const img = document.getElementById("reader-img");
    img.src = readerPages[readerIndex];
    img.classList.remove("zoomed"); // сбрасываем масштаб при смене страницы
    readerZoomLevel = 1;
    document.getElementById("reader-counter").innerText = `${readerIndex + 1} / ${readerPages.length}`;
    document.getElementById("reader-prev").disabled = readerIndex === 0;
    document.getElementById("reader-next").disabled = readerIndex === readerPages.length - 1;
  }

  // НОВОЕ: масштабирование страницы книги (мелкий шрифт сканов трудно читать без зума)
  let readerZoomLevel = 1;
  const ZOOM_STEP = 0.5;
  const ZOOM_MAX = 4;
  const ZOOM_MIN = 1;

  function applyReaderZoom() {
    const img = document.getElementById("reader-img");
    if (readerZoomLevel <= 1) {
      img.classList.remove("zoomed");
      img.style.width = "";
    } else {
      img.classList.add("zoomed");
      img.style.width = (readerZoomLevel * 100) + "%";
    }
  }

  function readerZoomIn() {
    readerZoomLevel = Math.min(ZOOM_MAX, readerZoomLevel + ZOOM_STEP);
    applyReaderZoom();
  }

  function readerZoomOut() {
    readerZoomLevel = Math.max(ZOOM_MIN, readerZoomLevel - ZOOM_STEP);
    applyReaderZoom();
  }

  // Клик по странице — приближает/отдаляет (двойной клик на телефоне тоже сработает как два клика подряд)
  document.getElementById("reader-img").addEventListener("click", function () {
    if (readerZoomLevel > 1) {
      readerZoomLevel = 1;
    } else {
      readerZoomLevel = 2;
    }
    applyReaderZoom();
  });

  // Колёсико мыши — тоже масштабирует (удобно на компьютере)
  document.getElementById("reader-page-wrapper").addEventListener("wheel", function (e) {
    if (!document.getElementById("reader").classList.contains("active")) return;
    e.preventDefault();
    if (e.deltaY < 0) readerZoomIn(); else readerZoomOut();
  }, { passive: false });

  function readerPrev() {
    if (readerIndex > 0) { readerIndex--; renderReaderPage(); }
  }

  function readerNext() {
    if (readerIndex < readerPages.length - 1) { readerIndex++; renderReaderPage(); }
  }

  // Управление стрелками клавиатуры и Escape
  document.addEventListener("keydown", function (e) {
    if (!document.getElementById("reader").classList.contains("active")) return;
    if (e.key === "ArrowLeft") readerPrev();
    else if (e.key === "ArrowRight") readerNext();
    else if (e.key === "Escape") closeReader();
  });

  // Свайп пальцем на телефоне — листать страницы
  (function () {
    let touchStartX = null;
    const wrapper = document.getElementById("reader-page-wrapper");
    wrapper.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX;
    });
    wrapper.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      // Если страница увеличена — свайп используется для прокрутки/панорамирования,
      // а не для перехода на другую страницу.
      if (readerZoomLevel <= 1) {
        if (dx > 50) readerPrev();
        else if (dx < -50) readerNext();
      }
      touchStartX = null;
    });
  })();

  function openLightbox(src) {
    if (src.toLowerCase().endsWith('.pdf')) {
      window.open(src, '_blank');
      return; 
    }
    
    const container = document.getElementById("lightbox-content");
    container.innerHTML = `<img src="${src}" alt="Просмотр документа" style="max-width: 100%; max-height: 100%; object-fit: contain;">`;
    document.getElementById("lightbox").classList.add("active");
  } 

  function closeLightbox() {
    const lightbox = document.getElementById("lightbox");
    const container = document.getElementById("lightbox-content");
    if (lightbox) lightbox.classList.remove("active");
    if (container) container.innerHTML = "";
  }

  window.onload = initArchive;
</script>
</body>
</html>
