<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Летопись рода Смагаринских</title>

  <script src="https://balkan.app/js/FamilyTree.js"></script>
  <script src="database.js"></script>
  <script src="documents-index.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #fcfaf2; }
    h1 { text-align: center; color: maroon; }
    .active { font-weight: bold; color: maroon; }

    .lang-btn.active {
      background-color: #4CAF50;
      color: white;
      border-color: #3e8e41;
      font-weight: bold;
    }

    #header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      padding-right: 10px;
      position: relative;
    }
    #custom-search-wrapper { position: relative; width: 220px; }
    #custom-search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    #custom-search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      max-height: 250px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      text-align: left;
    }
    #custom-search-results div {
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    #custom-search-results div:hover { background: #f0f0f0; }

    #main-wrapper { display: flex; gap: 15px; width: 100%; height: 780px; position: relative; }
    #family-tree {
      flex-grow: 1;
      height: 100%;
      border: 1px solid #ccc;
      background: #fff;
      width: 100% !important;
      position: relative !important;
    }

    #custom-side-panel {
      width: 380px; min-width: 380px; height: 100%; background: #fff;
      border: 1px solid #ccc; box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      box-sizing: border-box; display: none; flex-direction: column;
    }

    .panel-content-scroll { flex-grow: 1; overflow-y: auto; padding: 20px; }
    .panel-photo-container { text-align: center; margin-bottom: 15px; }
    .panel-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid maroon; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .panel-input-name { font-size: 18px; font-weight: bold; text-align: center; width: 100%; box-sizing: border-box; border: 1px solid #ddd; padding: 6px; border-radius: 4px; color: #333; margin-bottom: 6px; }
    .panel-input-years { font-style: italic; text-align: center; width: 100%; font-size: 13px; box-sizing: border-box; border: 1px solid #ddd; padding: 5px; border-radius: 4px; color: #666; margin-bottom: 15px; }
    .milestone-input { width: 100%; box-sizing: border-box; border: 1px solid #ddd; padding: 5px; border-radius: 4px; font-size: 13px; }

    .custom-title { font-weight: bold; margin-top: 18px; margin-bottom: 8px; color: maroon; border-bottom: 1px solid #ddd; padding-bottom: 3px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .milestones-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
    .milestones-table td { padding: 5px 0; vertical-align: middle; }
    .td-lbl { font-weight: bold; color: #777; width: 35%; }

    .family-circle-container { max-height: 140px; overflow-y: auto; border: 1px solid #eee; background: #fafafa; border-radius: 4px; padding: 8px; }
    .family-list { margin: 0; padding-left: 0; list-style: none; font-size: 13px; line-height: 1.5; color: #444; }
    .family-list li { margin-bottom: 5px; }
    .family-link { color: maroon; text-decoration: none; cursor: pointer; font-weight: bold; }
    .family-link:hover { color: #600000; text-decoration: underline; }

    .btn-row { display: flex; gap: 6px; margin-top: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .action-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; background: #fdfdfd; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .action-btn:hover { background: #f0f0f0; border-color: #888; }
    .btn-archive { background: #8b8b8b !important; color: white !important; border: none; }
    .btn-archive.has-data { background: maroon !important; cursor: pointer; }

    .geni-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f5f3eb; padding: 8px; border-radius: 6px; border: 1px solid #d1c7bd; margin: 8px 0; }
    .geni-btn { padding: 6px; font-size: 12px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; text-align: left; color: #444; }
    .geni-btn:hover { background: maroon; color: white; }

    .bio-panel { background: #fdfbf7; border: 1px dashed #d1c7bd; padding: 10px; border-radius: 4px; margin-top: 10px; }
    .bio-textarea { width: 100%; height: 85px; box-sizing: border-box; border: 1px solid #ddd; padding: 6px; border-radius: 4px; font-size: 13px; resize: vertical; }

    .panel-fixed-footer { background: #f4f4f4; border-top: 1px solid #ccc; padding: 15px 20px; box-sizing: border-box; }
    .btn-save { background: #27ae60 !important; color: white !important; border: none; width: 100%; padding: 10px; font-size: 14px; font-weight: bold; margin-bottom: 8px; border-radius: 4px; cursor: pointer; display: block; text-align: center; }
    .btn-save:hover { background: #219653 !important; }
    .btn-download-db { background: maroon !important; color: white !important; border: none; width: 100%; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; display: block; text-align: center; }
    .btn-download-db:hover { background: #600000 !important; }

    .hidden-block { display: none; }
    .bft-edit-form, .bft-dialog, .bft-lightbox, .bft-control { display: none !important; }

    .panel-close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      z-index: 10;
      transition: color 0.2s;
    }
    .panel-close-btn:hover { color: maroon; }

    .panel-textarea-name {
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ddd;
      padding: 6px;
      border-radius: 4px;
      color: #333;
      margin-bottom: 6px;
      resize: none;
      overflow: hidden;
    }

    /* ==== ОФОРМЛЕНИЕ КАРТОЧЕК ==== */
    .node.deceased > rect {
      fill: #d9d9d9 !important;
      stroke: #000000 !important;
      stroke-width: 3px !important;
    }
    .node.male:not(.deceased) > rect {
      fill: #CDE3F2 !important;
      stroke: #7FAECB !important;
      stroke-width: 2px !important;
    }
    .node.female:not(.deceased) > rect {
      fill: #F4D3E0 !important;
      stroke: #C98EAB !important;
      stroke-width: 2px !important;
    }

    .node text,
    .node tspan {
      fill: #1a1a1a !important;
      stroke: none !important;
      font-weight: 600 !important;
    }

    .node text.field_0 { font-size: 18px !important; font-weight: bold !important; }
    .node text.field_1 { font-size: 12px !important; font-weight: normal !important; }

    .node.male:not(.deceased):hover > rect {
      stroke: #4A90C2 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
      cursor: pointer;
    }
    .node.female:not(.deceased):hover > rect {
      stroke: #D96B9E !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
      cursor: pointer;
    }
    .node.deceased:hover > rect {
      stroke: #000000 !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
      cursor: pointer;
    }

    [data-l-id] path {
      stroke: #8B0000 !important;
      stroke-width: 2.5px !important;
    }

    #base_up path,
    #base_up ellipse,
    #hugo_up path,
    #hugo_up ellipse {
      fill: #4CAF50 !important;
      stroke: #4CAF50 !important;
    }

    /* ==== ПОДСКАЗКА ==== */
    .tip-container {
      text-align: center;
      margin: -10px 0 15px 0;
      padding: 10px 20px;
      background: rgba(139, 0, 0, 0.04);
      border-radius: 6px;
      border-left: 3px solid maroon;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tip-text { font-size: 15px; color: #555; letter-spacing: 0.3px; line-height: 1.5; }
    .tip-text strong { color: maroon; font-weight: 600; }
    .tip-icon-inline { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 3px; }
    .tip-icon-inline svg { display: block; width: 22px; height: 22px; }

    @media (max-width: 600px) {
      .tip-text { font-size: 13px; }
      .tip-container { padding: 8px 14px; margin: -5px 0 10px 0; }
      .tip-icon-inline svg { width: 20px; height: 20px; }
    }

    /* ==== АДАПТИВНОСТЬ ==== */
    @media (max-width: 1024px) {
      body { margin: 10px; }
      h1 { font-size: 22px; }
      #header-bar { gap: 8px; padding-right: 5px; flex-wrap: wrap; }
      #custom-search-wrapper { width: 160px; }
      #custom-search-input { font-size: 13px; padding: 5px 8px; }
      #main-wrapper { height: 640px; gap: 10px; }
      #custom-side-panel { width: 320px; min-width: 320px; }
    }
    @media (max-width: 768px) {
      body { margin: 6px; }
      h1 { font-size: 18px; margin-bottom: 8px; }
      #header-bar { gap: 6px; margin-bottom: 8px; padding-right: 0; justify-content: center; flex-wrap: wrap; }
      #custom-search-wrapper { width: 100%; max-width: 260px; }
      #custom-search-input { font-size: 13px; padding: 5px 8px; }
      #btn-surnames, #btn-ru, #btn-en, #btn-edit-lock {
        padding: 4px 8px !important;
        font-size: 12px !important;
      }
      #person-count-badge {
        height: 20px !important;
        min-width: 24px !important;
        font-size: 11px !important;
      }
      .tip-container { padding: 6px 10px; margin: -5px 0 8px 0; gap: 6px; }
      .tip-text { font-size: 12px; line-height: 1.4; }
      .tip-icon-inline svg { width: 18px; height: 18px; }
      #main-wrapper {
        height: calc(100vh - 180px);
        min-height: 400px;
        gap: 0;
        flex-direction: column;
      }
      #custom-side-panel {
        width: 100%;
        min-width: 100%;
        height: 50%;
        max-height: 500px;
      }
      .node text { font-size: 14px !important; }
      .node text.field_0 { font-size: 14px !important; }
      .node text.field_1 { font-size: 10px !important; }
    }
    @media (max-width: 480px) {
      body { margin: 4px; }
      h1 { font-size: 16px; margin-bottom: 6px; }
      #header-bar { gap: 4px; margin-bottom: 6px; }
      #custom-search-wrapper { width: 100%; }
      #btn-surnames, #btn-ru, #btn-en, #btn-edit-lock {
        padding: 3px 6px !important;
        font-size: 11px !important;
      }
      .tip-container { padding: 5px 8px; font-size: 11px; }
      .tip-text { font-size: 11px; }
      .tip-icon-inline svg { width: 16px; height: 16px; }
      #main-wrapper { height: calc(100vh - 140px); min-height: 350px; }
      #custom-side-panel { height: 60%; max-height: 400px; }
      .node text { font-size: 12px !important; }
      .node text.field_0 { font-size: 12px !important; }
      .node text.field_1 { font-size: 9px !important; }
      #surnames-overlay > div { padding: 16px !important; }
      #surnames-title { font-size: 18px !important; }
    }
  </style>
</head>
<body>

  <h1 id="main-title">Летопись поколений рода Смагаринских</h1>

  <div id="nav-tip" class="tip-container">
    <span id="tip-text" class="tip-text">
      Для просмотра всех ветвей используйте <strong>поиск</strong> или раскрывайте узлы кликом по <strong>зелёной иконке</strong> <span class="tip-icon-inline"><svg viewBox="0 0 40 40" width="22" height="22"><circle cx="20" cy="20" r="18" fill="white" stroke="#b0b0b0" stroke-width="2"/><circle cx="20" cy="14" r="6" fill="#4CAF50"/><circle cx="13" cy="22" r="6" fill="#4CAF50"/><circle cx="27" cy="22" r="6" fill="#4CAF50"/><rect x="19" y="20" width="2" height="12" fill="#4CAF50"/><rect x="15" y="31" width="10" height="2" rx="1" fill="#4CAF50"/></svg></span> на карточке персоны
    </span>
  </div>

  <div id="header-bar">
    <div id="custom-search-wrapper">
      <input type="text" id="custom-search-input" placeholder="Поиск персоны...">
      <div id="custom-search-results"></div>
    </div>
    <button id="btn-surnames" onclick="openSurnamesList()" style="background:none;border:1px solid #ccc;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:bold;">Список фамилий</button>
    <button id="btn-ru" class="lang-btn" onclick="setLanguage('ru')">RU</button>
    <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
    <button id="btn-edit-lock" onclick="toggleEditModeUI()" title="Режим редактирования" style="background:none;border:1px solid #ccc;border-radius:4px;padding:5px 8px;cursor:pointer;font-size:16px;">🔒</button>
    <span id="person-count-badge" title="Всего персон в дереве" style="display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;background:#2c3e50;color:#fff;border-radius:11px;font-size:12px;font-weight:bold;">0</span>
  </div>

  <div id="surnames-overlay" style="display:none;position:fixed;z-index:10002;top:0;left:0;width:100%;height:100%;background:#faf6ee;overflow-y:auto;">
    <div style="max-width:800px;margin:0 auto;padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 id="surnames-title" style="margin:0;">Список фамилий</h2>
        <button id="surnames-close-btn" onclick="closeSurnamesList()" style="background:none;border:1px solid #ccc;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:14px;">✕ Закрыть</button>
      </div>
      <div id="surnames-list-container"></div>
    </div>
  </div>

  <div id="main-wrapper">
    <div id="family-tree"></div>
    <div id="custom-side-panel"></div>
  </div>

  <script>
    let currentLang = "ru";
    const db = window.db || {};
    let activeNodeId = null;
    let treeInstance = null;

    const EDIT_PASSWORD = "kaluninA39";
    const TREE_CENTER_KEY = 'familyTree_centerPerson';

    /* =============================================================
       СОХРАНЕНИЕ / ВОССТАНОВЛЕНИЕ ЦЕНТРАЛЬНОЙ ПЕРСОНЫ
       ============================================================= */
    function saveTreeCenterPerson(personId) {
      if (!personId || !db[personId]) return;
      try {
        localStorage.setItem(TREE_CENTER_KEY, personId);
      } catch (e) {}
    }

    function restoreTreeCenterPerson() {
      try {
        const savedId = localStorage.getItem(TREE_CENTER_KEY);
        if (!savedId) return false;
        if (!db[savedId]) {
          localStorage.removeItem(TREE_CENTER_KEY);
          return false;
        }
        if (treeInstance && typeof treeInstance.center === 'function') {
          try {
            treeInstance.center(savedId);
            return true;
          } catch (e) {}
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    function resetTreeCenter() {
      localStorage.removeItem(TREE_CENTER_KEY);
    }

    /* =============================================================
       РЕЖИМ РЕДАКТИРОВАНИЯ
       ============================================================= */
    function isEditModeOn() {
      return localStorage.getItem("familyTreeEditMode") === "true";
    }

    window.toggleEditModeUI = function () {
      if (isEditModeOn()) {
        if (confirm("Выключить режим редактирования на этом устройстве?")) {
          localStorage.removeItem("familyTreeEditMode");
          updateEditLockIcon();
        }
        return;
      }
      const pwd = prompt("Введите пароль для включения режима редактирования:");
      if (pwd === null) return;
      if (pwd === EDIT_PASSWORD) {
        localStorage.setItem("familyTreeEditMode", "true");
        alert("Режим редактирования включён на этом устройстве.");
        updateEditLockIcon();
      } else {
        alert("Неверный пароль.");
      }
    };

    function updateEditLockIcon() {
      const btn = document.getElementById("btn-edit-lock");
      if (!btn) return;
      if (isEditModeOn()) {
        btn.textContent = "🔓";
        btn.title = "Режим редактирования ВКЛЮЧЁН";
        btn.style.borderColor = "#4CAF50";
      } else {
        btn.textContent = "🔒";
        btn.title = "Режим редактирования выключен";
        btn.style.borderColor = "#ccc";
      }
    }

    function updatePersonCountBadge() {
      const badge = document.getElementById("person-count-badge");
      if (!badge) return;
      const count = Object.keys(db).length;
      badge.textContent = count;
      badge.title = (currentLang === 'en') ? `${count} people in the tree` : `Всего персон в дереве: ${count}`;
    }

    /* =============================================================
       СПИСОК ФАМИЛИЙ
       ============================================================= */
    function extractSurname(fullName) {
      if (!fullName) return "";
      let name = fullName.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
      const words = name.split(/\s+/).filter(Boolean);
      if (words.length === 0) return "";
      return words[words.length - 1];
    }

    function normalizeSurnameToMasculine(surname) {
      if (!surname) return surname;
      if (/кая$/.test(surname)) return surname.slice(0, -2) + 'ий';
      if (/ова$/.test(surname) || /ева$/.test(surname)) return surname.slice(0, -1);
      if (/ина$/.test(surname)) return surname.slice(0, -1);
      return surname;
    }

    function buildSurnamesIndex() {
      const index = {};
      Object.keys(db).forEach(id => {
        const person = db[id];
        const fullName = person.name ? (person.name[currentLang] || person.name.ru || person.name.en) : "";
        const surname = extractSurname(fullName);
        if (!surname) return;
        const masculine = normalizeSurnameToMasculine(surname);
        const key = masculine.toLowerCase();
        if (!index[key]) index[key] = { display: masculine, people: [] };
        index[key].people.push({ id, name: fullName });
      });
      return index;
    }

    function openSurnamesList() {
      const overlay = document.getElementById("surnames-overlay");
      const container = document.getElementById("surnames-list-container");
      const title = document.getElementById("surnames-title");
      title.textContent = (currentLang === 'en') ? "List of Surnames" : "Список фамилий";

      const index = buildSurnamesIndex();
      const sortedKeys = Object.keys(index).sort((a, b) => a.localeCompare(b, currentLang === 'en' ? 'en' : 'ru'));

      let html = "";
      sortedKeys.forEach(key => {
        const entry = index[key];
        const peopleSorted = entry.people.slice().sort((a, b) => a.name.localeCompare(b.name, currentLang === 'en' ? 'en' : 'ru'));
        html += `<div style="margin-bottom:18px;">
          <div style="font-size:18px;font-weight:bold;color:#2c3e50;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:6px;">
            ${entry.display} <span style="font-weight:normal;color:#888;font-size:14px;">(${entry.people.length})</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${peopleSorted.map(p => `<span onclick="jumpToPersonFromSurnames('${p.id}')" style="cursor:pointer;color:#1a5276;text-decoration:underline;padding:2px 4px;">${p.name}</span>`).join('')}
          </div>
        </div>`;
      });

      container.innerHTML = html || `<p>${currentLang === 'en' ? 'No persons found.' : 'Персоны не найдены.'}</p>`;
      overlay.style.display = "block";
    }

    function closeSurnamesList() {
      document.getElementById("surnames-overlay").style.display = "none";
    }

    function jumpToPersonFromSurnames(id) {
      closeSurnamesList();
      if (typeof showCustomSidePanel === 'function') {
        showCustomSidePanel(id);
      }
      if (treeInstance && typeof treeInstance.center === 'function') {
        try {
          treeInstance.center(id);
          saveTreeCenterPerson(id);
        } catch (e) {}
      }
    }

    /* =============================================================
       ФОТО
       ============================================================= */
    function getPhotoUrl(id) {
      const person = db[id];
      if (person && person.mainPhoto && person.mainPhoto.trim() !== "") {
        return person.mainPhoto;
      }

      let isFemale = false;
      if (person && person.gender) {
        isFemale = person.gender === "female";
      } else {
        let ruName = (person && person.name && person.name.ru) ? person.name.ru : "";
        let firstWord = ruName.trim().split(/\s+/)[0] || "";
        const MALE_EXCEPTIONS = ["никита", "илья", "лёва", "лева", "фома", "кузьма", "гоша"];
        let lower = firstWord.toLowerCase();
        if (MALE_EXCEPTIONS.includes(lower)) {
          isFemale = false;
        } else if (/[ая]$/i.test(firstWord)) {
          isFemale = true;
        } else if (id) {
          let idLower = id.toLowerCase();
          isFemale = idLower.includes("alla") || idLower.includes("blyuma") ||
                     idLower.includes("haya") || idLower.includes("khaya") ||
                     idLower.includes("feyga") || idLower.includes("slava") ||
                     idLower.includes("katya") || idLower.includes("mira") ||
                     idLower.includes("sonya") || idLower.includes("natalya") ||
                     idLower.includes("nella") || idLower.includes("nadejda");
        }
      }
      return isFemale ? "photos/female.jpg" : "photos/male.jpg";
    }

    /* =============================================================
       ПЕРЕВОДЫ
       ============================================================= */
    const labels = {
      ru: {
        birth: "Место рождения", marriage: "Брак", job: "Род занятий", burial: "Место упокоения",

    function buildAutomaticFamilyHtml(nodeId) {
      const person = db[nodeId];
      if (!person) return "";
      const bText = labels[currentLang];
      let html = "";
      let cleanNodeId = String(nodeId).trim().toLowerCase();

      const getLinkOrText = (idOrName) => {
        if (!idOrName) return null;
        let targetStr = String(idOrName).trim();
        if (!targetStr) return null;
        if (db[targetStr]) {
          let name = db[targetStr].name[currentLang] || db[targetStr].name['ru'] || targetStr;
          return `<span class="family-link" onclick="showCustomSidePanel('${targetStr}')">${name}</span>`;
        }
        return null;
      };

      let fatherId = (person.links && person.links.parents && person.links.parents[0]) ? person.links.parents[0] : (person.fid || person.father);
      let motherId = (person.links && person.links.parents && person.links.parents[1]) ? person.links.parents[1] : (person.mid || person.mother);
      let spouseId = (person.links && person.links.spouse) ? person.links.spouse : (person.pid || person.spouse);

      let fatherHtml = getLinkOrText(fatherId);
      let motherHtml = getLinkOrText(motherId);
      let spouseHtml = getLinkOrText(spouseId);

      let fatherNote = (person.links && person.links.fatherNote) ? ` (${person.links.fatherNote})` : "";
      let motherNote = (person.links && person.links.motherNote) ? ` (${person.links.motherNote})` : "";
      let spouseNote = (person.links && person.links.spouseNote) ? ` (${person.links.spouseNote})` : "";

      if (fatherHtml) html += `<li><strong>${bText.father}:</strong> ${fatherHtml}${fatherNote}</li>`;
      if (motherHtml) html += `<li><strong>${bText.mother}:</strong> ${motherHtml}${motherNote}</li>`;

      let bioFatherText = (person.links && person.links.biologicalFatherName) ? person.links.biologicalFatherName : "";
      let bioMotherText = (person.links && person.links.biologicalMotherName) ? person.links.biologicalMotherName : "";
      if (bioFatherText) html += `<li><strong>${bText.biologicalFather}:</strong> ${bioFatherText}</li>`;
      if (bioMotherText) html += `<li><strong>${bText.biologicalMother}:</strong> ${bioMotherText}</li>`;

      if (spouseHtml) html += `<li><strong>${bText.spouse}:</strong> ${spouseHtml}${spouseNote}</li>`;

      const getBirthYear = (id) => {
        let y = db[id] && db[id].years;
        if (!y) return null;
        let match = String(y).match(/\d{4}/);
        return match ? parseInt(match[0], 10) : null;
      };

      let childrenIds = [];
      Object.keys(db).forEach(id => {
        if (id === nodeId) return;
        const potentialChild = db[id];
        let isChild = false;

        if (potentialChild.fid && String(potentialChild.fid).trim().toLowerCase() === cleanNodeId) isChild = true;
        if (potentialChild.mid && String(potentialChild.mid).trim().toLowerCase() === cleanNodeId) isChild = true;

        if (!isChild && potentialChild.links && potentialChild.links.parents) {
          let parentsArrayLower = potentialChild.links.parents.map(p => p ? String(p).trim().toLowerCase() : "");
          if (parentsArrayLower.includes(cleanNodeId)) isChild = true;
        }

        if (isChild) childrenIds.push(id);
      });

      childrenIds.sort((a, b) => {
        let ya = getBirthYear(a);
        let yb = getBirthYear(b);
        if (ya === null && yb === null) return 0;
        if (ya === null) return 1;
        if (yb === null) return -1;
        return ya - yb;
      });

      let childrenLinks = childrenIds.map(id => getLinkOrText(id)).filter(Boolean);

      if (childrenLinks.length > 0) {
        html += `<li><strong>${bText.children}:</strong> ${childrenLinks.join(", ")}</li>`;
      }

      return html ? `<ul class="family-list">${html}</ul>` : `<div style="color:#999; font-style:italic; font-size:13px;">${bText.no_relations}</div>`;
    }

        if (note) currentPerson.links.motherNote = note;
      } else if (role === 'spouse') {
        db[newId].links.spouse = activeNodeId;
        currentPerson.links.spouse = newId;
        let note = askOptionalNote("Пометка к браку (необязательно):", "Marriage note (optional):");
        if (note) {
          currentPerson.links.spouseNote = note;
          db[newId].links.spouseNote = note;
        }

        if (currentPerson.links.spouse) {

                         idLower.includes("haya") || idLower.includes("khaya") ||
                         idLower.includes("feyga") || idLower.includes("slava") ||
                         idLower.includes("katya") || idLower.includes("mira") ||
                         idLower.includes("sonya") || idLower.includes("natalya") ||
                         idLower.includes("nella") || idLower.includes("nadejda");

          db[newId].links.parents = isFemale ? [currentPerson.links.spouse, activeNodeId] : [activeNodeId, currentPerson.links.spouse];
        } else {
          db[newId].links.parents = [activeNodeId];
        }
      }

      document.getElementById("geni-add-menu").classList.add("hidden-block");
      drawTree();
      updatePersonCountBadge();
      showCustomSidePanel(newId);
    };

    function getShortDisplayName(fullName) {
      if (!fullName) return fullName;
      let cleaned = fullName.replace(/\s*\([^)]*\)/g, "").trim();
      let parts = cleaned.split(/\s+/).filter(Boolean);
      if (parts.length <= 2) return cleaned;
      return parts[0] + " " + parts[parts.length - 1];
    }

    function isPersonDeceased(person) {
      if (person.isDeceased === true) return true;
      if (person.isDeceased === false) return false;

      const years = person.years;
      if (!years || typeof years !== "string") return false;

      const clean = years.trim();
      if (/^\?\s*[–—-]\s*\?\s*$/.test(clean)) return true;

      const allYears = clean.match(/\d{4}/g) || [];
      if (allYears.length === 0) return false;

      const match = clean.match(/[–—-]\s*(.+)$/);
      if (match) {
        const afterDash = match[1].trim();
        if (afterDash === "?" || afterDash === "??" || afterDash === "—") return true;
        if (/\d{4}/.test(afterDash)) return true;
      }

      if (allYears.length === 1) {
        const birthYear = parseInt(allYears[0], 10);
        const currentYear = new Date().getFullYear();
        if (currentYear - birthYear > 100) return true;
      }

      return false;
    }

    function determineFemale(person, id) {
      if (person && person.gender) return person.gender === "female";

      const ruName = (person && person.name && person.name.ru) ? person.name.ru : "";
      const firstWord = ruName.trim().split(/\s+/)[0] || "";
      const MALE_EXCEPTIONS = ["никита", "илья", "лёва", "лева", "фома", "кузьма", "гоша"];
      const lower = firstWord.toLowerCase();

      if (MALE_EXCEPTIONS.includes(lower)) return false;
      if (/[ая]$/i.test(firstWord)) return true;

      const idLower = (id || "").toLowerCase();
      return idLower.includes("alla") || idLower.includes("blyuma") ||
             idLower.includes("haya") || idLower.includes("khaya") ||
             idLower.includes("feyga") || idLower.includes("slava") ||
             idLower.includes("katya") || idLower.includes("mira") ||
             idLower.includes("sonya") || idLower.includes("natalya") ||
             idLower.includes("nella") || idLower.includes("nadejda");
    }

        if (person.name) {

            } else {
              rawName = currentLang === 'en'
                ? `[EN?] ${person.name['ru'] || id}`
                : (person.name['ru'] || id);
            }
          } else {
            rawName = person.name;
          }
        }

        const node = {
          id: id,
          name: getShortDisplayName(rawName),
          fullName: rawName,
          title: person.years || "",
          img: photoUrl
        };

        const isFemale = determineFemale(person, id);
        const deceased = isPersonDeceased(person);

        const nodeTags = [];
        nodeTags.push(isFemale ? "female" : "male");
        if (deceased) nodeTags.push("deceased");
        node.tags = nodeTags;

        if (person.links) {
          if (person.links.spouse && String(person.links.spouse).trim()) {
            node.pids = [person.links.spouse];
          }
          if (person.links.parents && Array.isArray(person.links.parents)) {
            if (person.links.parents[0] && String(person.links.parents[0]).trim()) node.fid = person.links.parents[0];
            if (person.links.parents[1] && String(person.links.parents[1]).trim()) node.mid = person.links.parents[1];
          }
        }

        if (person.fid && (!person.links || !person.links.parents || !person.links.parents[0])) {
          if (!person.links) person.links = { parents: [], spouse: null };
          person.links.parents[0] = person.fid;
          node.fid = person.fid;
        }
        if (person.mid && (!person.links || !person.links.parents || !person.links.parents[1])) {
          if (!person.links) person.links = { parents: [], spouse: null };
          person.links.parents[1] = person.mid;
          node.mid = person.mid;
        }
        if (person.pid && (!person.links || !person.links.spouse)) {
          if (!person.links) person.links = { parents: [], spouse: null };
          person.links.spouse = person.pid;
          node.pids = [person.pid];
        }

        treeData.push(node);
      });
      return treeData;
    }

    function drawTree() {
      const container = document.getElementById("family-tree");
      if (!container) return;
      container.innerHTML = "";

      try {
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 480;

        let cardWidth, cardHeight, circleSize, imageSize, levelSep, siblingSep, subtreeSep;

        if (isSmallMobile) {
          cardWidth = 90; cardHeight = 72; circleSize = 26; imageSize = 26;
          levelSep = 45; siblingSep = 22; subtreeSep = 30;
        } else if (isMobile) {
          cardWidth = 100; cardHeight = 80; circleSize = 30; imageSize = 30;
          levelSep = 52; siblingSep = 26; subtreeSep = 36;
        } else {
          cardWidth = 112; cardHeight = 90; circleSize = 34; imageSize = 34;
          levelSep = 60; siblingSep = 30; subtreeSep = 40;
        }

        treeInstance = new FamilyTree(container, {
          mouseScroller: { zoom: true, scale: true },
          editForm: false,
          enableSearch: false,
          lazyLoading: false,
          nodeBinding: { field_0: "name", field_1: "title", img_0: "img" },
          nodeWidth: cardWidth,
          nodeHeight: cardHeight,
          nodeCircleSize: circleSize,
          nodeImageSize: imageSize,
          levelSeparation: levelSep,
          siblingSeparation: siblingSep,
          subtreeSeparation: subtreeSep
        });

        treeInstance.on('click', function (sender, args) {
          showCustomSidePanel(args.node.id);
          saveTreeCenterPerson(args.node.id);
          return false;
        });

        treeInstance.onInit(function () {
          try {
            // На мобильных — ограничиваем глубину раскрытия
            if (window.innerWidth <= 768) {
              if (db["person_vulf_1898"]) {
                treeInstance.center("person_vulf_1898");
              }
              treeInstance.maximize("person_vulf_1898", false, false, function () {
                try {
                  treeInstance.fit();
                } catch (e) {}
              });
            } else {
              treeInstance.maximize(null, false, false, function () {
                try {
                  const restored = restoreTreeCenterPerson();
                  if (!restored) {
                    if (db["person_vulf_1898"]) {
                      treeInstance.center("person_vulf_1898");
                    } else {
                      treeInstance.fit();
                    }
                  }
                } catch (e) {}
              });
            }
          } catch (e) {}
        });

        treeInstance.load(getTreeData());

        if (!window._resizeHandler) {
          window._resizeHandler = true;
          let resizeTimer;
          window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
              const newIsMobile = window.innerWidth <= 768;
              const newIsSmallMobile = window.innerWidth <= 480;
              if (newIsMobile !== window._lastIsMobile || newIsSmallMobile !== window._lastIsSmallMobile) {
                window._lastIsMobile = newIsMobile;
                window._lastIsSmallMobile = newIsSmallMobile;
                drawTree();
              }
            }, 300);
          });
        }

        window._lastIsMobile = isMobile;
        window._lastIsSmallMobile = isSmallMobile;

      } catch (e) {
        console.error("Ошибка инициализации дерева:", e);
      }
    }

    /* =============================================================
       ПОИСК
       ============================================================= */
    (function () {
      const input = document.getElementById("custom-search-input");
      const resultsBox = document.getElementById("custom-search-results");
      if (!input || !resultsBox) return;

      function hideResults() {
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
      }

      input.addEventListener("input", function () {
        const value = input.value.trim();
        if (!value || !treeInstance) {
          hideResults();
          return;
        }
        let matches = [];
        try {
          matches = treeInstance.search(value, ["name", "fullName"]) || [];
        } catch (e) {
          matches = [];
        }
        if (matches.length === 0) {
          hideResults();
          return;
        }
        resultsBox.innerHTML = "";
        matches.slice(0, 15).forEach(function (m) {
          const row = document.createElement("div");
          row.textContent = m.fullName || m.name || m.id;
          row.onclick = function () {
            hideResults();
            input.value = "";
            try {
              treeInstance.center(m.id);
              saveTreeCenterPerson(m.id);
            } catch (e) {}
            showCustomSidePanel(m.id);
          };
          resultsBox.appendChild(row);
        });
        resultsBox.style.display = "block";
      });

      document.addEventListener("click", function (e) {
        if (e.target !== input) hideResults();
      });
    })();

    /* =============================================================
       ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА
       ============================================================= */
    function setLanguage(lang) {
      currentLang = lang;

      const btnRu = document.getElementById("btn-ru");
      const btnEn = document.getElementById("btn-en");

      if (btnRu && btnEn) {
        if (lang === 'ru') {
          btnRu.classList.add('active');
          btnEn.classList.remove('active');
        } else {
          btnEn.classList.add('active');
          btnRu.classList.remove('active');
        }
      }

      const mainTitle = document.getElementById("main-title");
      if (mainTitle) {
        mainTitle.innerText = lang === 'ru' ? 'Летопись поколений рода Смагаринских' : 'The Smagarinsky Family Chronicle';
      }

      const searchInput = document.getElementById("custom-search-input");
      if (searchInput) {
        searchInput.placeholder = lang === 'ru' ? 'Поиск персоны...' : 'Search person...';
      }

      if (typeof activeNodeId !== 'undefined' && activeNodeId) {
        showCustomSidePanel(activeNodeId);
      }

      if (typeof drawTree === 'function') {
        drawTree();
      }
      updatePersonCountBadge();

      const tipElement = document.getElementById("tip-text");
      if (tipElement) {
        tipElement.innerHTML = labels[currentLang].tip;
      }

      const surnamesBtn = document.getElementById("btn-surnames");
      if (surnamesBtn) {
        surnamesBtn.textContent = labels[currentLang].surnames;
      }

      const surnamesCloseBtn = document.getElementById("surnames-close-btn");
      if (surnamesCloseBtn) {
        surnamesCloseBtn.textContent = labels[currentLang].close;
      }
    }

    /* =============================================================
       СТАРТ
       ============================================================= */
    setLanguage('ru');
    updateEditLockIcon();
    updatePersonCountBadge();
  </script>
</body>
</html>
